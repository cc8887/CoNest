services:
  conest:
    image: conest:0.2.0-alpha.1
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./secrets/model-test.env
    volumes:
      - conest-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 45s
volumes:
  conest-data:
