services:
  conest:
    image: conest:0.1.0-m0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3087:3087"
      - "127.0.0.1:3088:3088"
    env_file:
      - ./secrets/model-test.env
    volumes:
      - conest-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 45s
volumes:
  conest-data:
